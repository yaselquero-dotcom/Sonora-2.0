
name: Compilar SONORA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      -       - name: Buscar proyecto Android
        id: project
        run: |
          FILE=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No se encontró settings.gradle"
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SONORA-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
